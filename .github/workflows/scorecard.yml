name: ossf scorecard

# Scorecard requires public repo visibility to query the GitHub GraphQL
# API. While the repo is private this workflow is effectively disabled.
on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Sunday at 05:00 UTC.
    - cron: "0 5 * * 0"

permissions: read-all

jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: run scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: upload sarif
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
